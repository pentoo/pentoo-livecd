[supervisord]
nodaemon=true
#loglevel=trace
logfile=/var/log/supervisord.log

[supervisorctl]
 
[inet_http_server]
port=127.0.0.1:9001

[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:X11]
command=/usr/bin/Xvfb :1 -screen 1 1280x800x24
autorestart=true
priority=300

[program:x11vnc]
command=/usr/bin/x11vnc -localhost -cursor arrow -nopw -display :1 -xkb -noxrecord -noxdamage -wait 5 -shared -forever -nomodtweak
autorestart=true
depends_on=X11
priority=400

[program:xfce]
autorestart=true
command=/usr/bin/xfce4-session
environment=DISPLAY=":1",HOME="/root",USER="root"
depends_on=X11
priority=500

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080
autorestart=true
depends_on=x11vnc
priority=600
