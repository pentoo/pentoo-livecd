name: tests

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck livecd/tools/*.sh livecd/automation/pentoo_sign_binpkgs.sh
      # Ubuntu's AppArmor policy blocks mounts in unprivileged user namespaces
      - name: catalyst_clean
        run: sudo livecd/tools/test-catalyst-clean.sh
      - name: mirror_sync and pentoo_binpkgs.sh
        run: livecd/tools/test-mirror-sync.sh

  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: binpkg signing
        run: |
          docker create --name portage gentoo/portage
          docker run --rm --volumes-from portage -v "$PWD":/src -w /src gentoo/stage3 livecd/tools/test-sign-binpkgs.sh
