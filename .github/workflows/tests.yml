name: tests

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck livecd/tools/*.sh livecd/automation/pentoo_sign_binpkgs.sh livecd/root_overlay/etc/local.d/50-pentoo-trust-helper.start
      # Ubuntu's AppArmor policy blocks mounts in unprivileged user namespaces
      - name: catalyst_clean
        run: sudo livecd/tools/test-catalyst-clean.sh
      - name: mirror_sync and pentoo_binpkgs.sh
        run: livecd/tools/test-mirror-sync.sh
      - name: check-mirror-signed
        run: livecd/tools/test-check-mirror-signed.sh
      - name: images drop /etc/portage/gnupg
        run: livecd/tools/test-image-cleanup.sh
      - name: iso trusts the binhost key at boot
        run: livecd/tools/test-livecd-trust-hook.sh

  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: binpkg signing
        run: |
          docker create --name portage gentoo/portage
          docker run --rm --volumes-from portage -v "$PWD":/src -w /src gentoo/stage3 livecd/tools/test-sign-binpkgs.sh
